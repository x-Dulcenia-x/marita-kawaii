<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marita - Kawaii Space</title>
    <style>
        /* Cursor personalizado de corazón con parpadeo */
        body {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23ff9ecd' stroke='%23ffffff' stroke-width='2' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>"), auto;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Fondo con imagen y opacidad del 80% sobre fondo negro */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(255,182,193,0.2)), url('https://xatimg.com/image/sVp4PkQHEywp.png');
            background-size: cover;
            background-position: center;
            opacity: 0.8;
            z-index: -2;
        }

        /* Lluvia de corazones y fondo rosita bajito cayendo */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .heart-fall {
            position: absolute;
            top: -10vh;
            color: #ffb6c1;
            font-size: 20px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 1; }
            100% { transform: translateY(110vh) translateX(20px); opacity: 0.2; }
        }

        /* Paneles independientes */
        .section-box {
            background: rgba(15, 15, 15, 0.85);
            border: 2px dashed #ffb6c1;
            border-radius: 20px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
            text-align: center;
        }

        /* Panel de Contraseña */
        #auth-panel {
            margin-top: 15vh;
        }
        
        /* Título Marita con cursiva y parpadeo de colores lila, azul, rosa */
        .title-marita {
            font-style: italic;
            font-size: 2.2rem;
            animation: colorBlink 3s infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes colorBlink {
            0% { color: #d8b4fe; } /* Lila */
            33% { color: #93c5fd; } /* Azul */
            66% { color: #f472b6; } /* Rosa */
            100% { color: #d8b4fe; }
        }

        .password-container {
            position: relative;
            margin: 20px 0;
        }
        input[type="password"], input[type="text"] {
            padding: 10px 40px 10px 15px;
            border-radius: 15px;
            border: 2px solid #d8b4fe;
            background: #1a1a1a;
            color: #d8b4fe;
            font-size: 1.1rem;
            outline: none;
            width: 70%;
        }
        .eye-icon {
            position: absolute;
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #f472b6;
        }

        .btn-enter {
            background: linear-gradient(45deg, #f472b6, #d8b4fe);
            border: none;
            padding: 10px 25px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn-enter:hover {
            transform: scale(1.05);
        }

        /* Contenido Principal (Oculto inicialmente) */
        #main-content {
            display: none;
        }

        /* Reloj Zona Horaria America/Mexico_City */
        .clock-box {
            font-size: 1rem;
            color: #93c5fd;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Foto de Perfil con círculo punteado giratorio */
        .profile-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
        }
        .profile-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            border: 4px dotted;
            border-color: #93c5fd #d8b4fe #f472b6 #93c5fd;
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .profile-img {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;
            animation: photoBlink 2s infinite alternate;
        }
        @keyframes photoBlink {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .creadora-tag {
            color: #f472b6;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .status-box {
            font-size: 0.9rem;
            color: #ffb6c1;
            margin: 10px 0;
        }

        /* Cuadros de Estadísticas y Signo Pequeños */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #d8b4fe;
            border-radius: 12px;
            padding: 8px;
            font-size: 0.85rem;
            text-align: center;
        }
        .stat-card span {
            display: block;
            font-weight: bold;
            color: #93c5fd;
        }

        /* Pie de página */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #ffb6c1;
            margin: 30px 0;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="rain-container" id="rain"></div>

    <div id="auth-panel" class="section-box">
        <div class="title-marita">Marita</div>
        <p style="font-size: 0.9rem; color: #d8b4fe;">Contraseña(9070)</p>
        <div class="password-container">
            <input type="password" id="passInput" placeholder="Ingresa clave">
            <span class="eye-icon" onclick="togglePassword()">👁️</span>
        </div>
        <button class="btn-enter" onclick="checkPassword()">Entrar</button>
        <p id="errorMsg" style="color: #ff6b6b; font-size: 0.8rem; display: none; margin-top: 10px;">¡Contraseña incorrecta, prueba con 9070! ✨</p>
    </div>

    <div id="main-content">
        
        <div class="section-box" style="padding: 10px; max-width: 300px;">
            <div class="clock-box" id="liveClock">Cargando hora...</div>
        </div>

        <div class="section-box">
            <div class="profile-container">
                <div class="profile-ring"></div>
                <img src="https://xatimg.com/image/MjxtztH9qgVR.png" alt="Foto Perfil" class="profile-img">
            </div>
            
            <div class="creadora-tag">@Marita✦ Creadora</div>
            <div class="status-box">✨ Conquistando el mundo.✨</div>
            <p style="font-size: 0.85rem; font-style: italic;">Un espacio lleno de Misterio, Dulzura y Magia.</p>

            <div class="stats-grid">
                <div class="stat-card">
                    Poder Mágico
                    <span>9999</span>
                </div>
                <div class="stat-card">
                    Seguidores
                    <span>15.8K</span>
                </div>
                <div class="stat-card">
                    Amor
                    <span>200% 💖</span>
                </div>
                <div class="stat-card">
                    Signo Zodiacal
                    <span>🏹 Sagitario</span>
                </div>
            </div>
        </div>

        <footer>
            @Dulcinea Hechizera 💖
        </div>
    </div>

    <script>
        /* Función para ver/ocultar contraseña */
        function togglePassword() {
            const input = document.getElementById('passInput');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        /* Validación de contraseña 9070 */
        function checkPassword() {
            const val = document.getElementById('passInput').value;
            if (val === '9070') {
                document.getElementById('auth-panel').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                const err = document.getElementById('errorMsg');
                err.style.display = 'block';
            }
        }

        /* Reloj en tiempo real para America/Mexico_City */
        function updateClock() {
            const options = { 
                timeZone: 'America/Mexico_City', 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            };
            const now = new Date().toLocaleString('es-MX', options);
            document.getElementById('liveClock').innerText = '📅 ' + now;
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* Generar lluvia de corazones rosita bajito */
        const rainContainer = document.getElementById('rain');
        const symbols = ['💖', '💗', '💓', '✨', '🌸'];
        for (let i = 0; i < 25; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart-fall');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            rainContainer.appendChild(heart);
        }
    </script>
</body>
</html>
