<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marita - Kawaii Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        /* Cursor personalizado de corazón parpadeante */
        body {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23ffb6c1' stroke='%2387ceeb' stroke-width='2' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>"), auto;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Fondo de Hello Kitty con opacidad 80% y fondo negro */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8) url('https://xatimg.com/image/sVp4PkQHEywp.png') no-repeat center center fixed;
            background-size: cover;
            z-index: -2;
        }

        /* Lluvia de corazones / Hello Kitty cayendo */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .falling-heart {
            position: absolute;
            top: -10vh;
            font-size: 20px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }

        /* Panel de Contraseña */
        #login-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            transition: opacity 0.5s ease;
        }

        .login-card {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #dda0dd;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(221, 160, 221, 0.5);
            width: 90%;
            max-width: 350px;
        }

        .login-card h2 {
            font-family: 'Sacramento', cursive;
            font-size: 2.8rem;
            margin-bottom: 20px;
            animation: colorBlink 3s infinite;
        }

        @keyframes colorBlink {
            0% { color: #dda0dd; text-shadow: 0 0 10px #dda0dd; }
            33% { color: #87ceeb; text-shadow: 0 0 10px #87ceeb; }
            66% { color: #ffb6c1; text-shadow: 0 0 10px #ffb6c1; }
            100% { color: #dda0dd; text-shadow: 0 0 10px #dda0dd; }
        }

        .password-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #dda0dd;
            background: #111;
            color: #dda0dd;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #dda0dd;
            font-size: 1.2rem;
        }

        .login-card button {
            background: linear-gradient(45deg, #dda0dd, #ffb6c1);
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-card button:hover {
            transform: scale(1.05);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        /* Contenido Principal (Oculto hasta poner contraseña) */
        #main-content {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Cabecera / Reloj */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.7);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(221, 160, 221, 0.3);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Secciones Independientes */
        .section-box {
            background: rgba(15, 15, 15, 0.85);
            border: 2px solid #dda0dd;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Sección de Perfil Compacta */
        .profile-header {
            text-align: center;
            position: relative;
        }

        /* Foto de perfil con círculo blanco y borde giratorio */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background: #fff; /* Círculo de la foto blanco */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 3px dotted transparent;
            border-top-color: #87ceeb;
            border-right-color: #dda0dd;
            border-bottom-color: #ffb6c1;
            border-left-color: #87ceeb;
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: photoBlink 2s infinite alternate;
        }

        @keyframes photoBlink {
            0% { opacity: 0.85; }
            100% { opacity: 1; }
        }

        .profile-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffb6c1;
            margin-bottom: 5px;
        }

        .profile-subtitle {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* Cuadros Estadísticos Pequeños */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(221, 160, 221, 0.4);
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
        }

        .stat-value {
            font-weight: bold;
            font-size: 0.95rem;
            color: #dda0dd;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #bbb;
            margin-top: 3px;
        }

        /* Responsive */
        @media(max-width: 480px) {
            #main-content {
                padding: 10px;
            }
            .login-card {
                width: 85%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="hearts-container" id="heartsContainer"></div>

    <div id="login-panel">
        <div class="login-card">
            <h2 id="magicTitle">Marita</h2>
            <div class="password-wrapper">
                <input type="password" id="passwordInput" placeholder="Contraseña(9070)">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            <button onclick="checkPassword()">Entrar</button>
            <div class="error-msg" id="errorMsg">Contraseña incorrecta</div>
        </div>
    </div>

    <div id="main-content">
        
        <div class="top-bar">
            <span id="currentDate">Cargando fecha...</span>
            <span id="currentTime">Cargando hora...</span>
        </div>

        <div class="section-box">
            <div class="profile-header">
                <div class="avatar-container">
                    <img src="https://xatimg.com/image/MjxtztH9qgVR.png" alt="Marita" class="avatar-img">
                </div>
                <div class="profile-title">@Marita✦ Creadora</div>
                <div class="profile-subtitle">
                    ✨ Conquistando el mundo. ✨<br>
                    Un espacio lleno de Misterio, Dulzura y Magia.
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">9999</div>
                        <div class="stat-label">Poder Mágico</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">15.8K</div>
                        <div class="stat-label">Seguidores</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">200% 💖</div>
                        <div class="stat-label">Amor</div>
                    </div>
                </div>

                <div style="margin-top: 15px; font-size: 0.85rem; color: #87ceeb; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; border: 1px dashed #dda0dd;">
                    🏹 Signo Zodiacal: <strong>Sagitario</strong> ♐
                </div>
            </div>
        </div>

        </div>

    <script>
        // Función para mostrar/ocultar contraseña con el ojo
        function togglePassword() {
            const pwdInput = document.getElementById('passwordInput');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
            } else {
                pwdInput.type = 'password';
            }
        }

        // Validación de Contraseña
        function checkPassword() {
            const pwd = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            if (pwd === '9070') {
                document.getElementById('login-panel').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-panel').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                }, 500);
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // Permitir Enter para iniciar sesión
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Generar Lluvia de Corazones y Hello Kitty
        const heartsContainer = document.getElementById('heartsContainer');
        const symbols = ['💖', '🤍', '🌸', '✨', '🎀', '🐱'];
        
        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-heart');
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 4 + 3) + 's';
            item.style.fontSize = (Math.random() * 12 + 16) + 'px';
            item.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            heartsContainer.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 7000);
        }
        setInterval(createFallingItem, 300);

        // Reloj y Fecha exacta en Mexico_City (UTC-6)
        function updateDateTime() {
            const optionsTime = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const optionsDate = { timeZone: 'America/Mexico_City', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('es-MX', optionsTime);
            const dateString = now.toLocaleDateString('es-MX', optionsDate);

            document.getElementById('currentTime').innerText = timeString;
            document.getElementById('currentDate').innerText = dateString;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
