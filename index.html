<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marita ✦ Perfil</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{

background:#000;
overflow-x:hidden;
color:white;

}

/*--------------------------*/
/* Fondo */
/*--------------------------*/

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.80),rgba(0,0,0,.80)),
url("https://xatimg.com/image/sVp4PkQHEywp.png");
background-size:cover;
background-position:center;
z-index:-5;
}

/* puntos */

body::after{
content:"";
position:fixed;
inset:0;
background-image:
radial-gradient(#d98cff 1px,transparent 1px),
radial-gradient(#6ad5ff 1px,transparent 1px),
radial-gradient(#ff92dd 1px,transparent 1px);
background-size:60px 60px;
opacity:.20;
z-index:-4;
}

/* lluvia corazones */

.hearts{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:-3;
}

.hearts span{
position:absolute;
font-size:18px;
animation:fall linear infinite;
opacity:.55;
}

@keyframes fall{

0%{
transform:translateY(-100px);
}

100%{
transform:translateY(110vh);
}

}

/* panel */

.panel{

width:360px;
max-width:95%;
margin:45px auto;
background:rgba(0,0,0,.80);
border-radius:28px;
backdrop-filter:blur(12px);
padding:25px;
border:2px solid rgba(255,255,255,.15);

box-shadow:
0 0 25px #c36cff66;

}

/* titulo */

h1{

font-family:cursive;
font-size:45px;
text-align:center;

animation:titulo 2s infinite;

}

@keyframes titulo{

0%{color:#d07fff;text-shadow:0 0 8px #d07fff;}
33%{color:#7fdcff;text-shadow:0 0 8px #7fdcff;}
66%{color:#ff9ee6;text-shadow:0 0 8px #ff9ee6;}
100%{color:#d07fff;text-shadow:0 0 8px #d07fff;}

}

label{

display:block;
margin-top:18px;
color:#d89cff;
font-weight:bold;

}

.inputBox{

position:relative;

}

input{

width:100%;
padding:14px;
border-radius:15px;
margin-top:10px;
border:none;
background:#111;
color:white;
font-size:16px;

}

.eye{

position:absolute;
right:15px;
top:24px;
cursor:pointer;
font-size:20px;

}

button{

width:100%;
margin-top:22px;
padding:15px;
font-size:18px;
border:none;
border-radius:18px;
cursor:pointer;

background:#ca82ff;
color:white;

transition:.3s;

}

button:hover{

transform:scale(1.03);

}

.fecha{

margin-top:18px;
text-align:center;
font-size:14px;
color:#ddd;

}

/* perfil */

#perfil{

display:none;

}

.avatar{

width:140px;
height:140px;
margin:auto;
border-radius:50%;
padding:5px;
background:white;

position:relative;

animation:avatar 2s infinite;

}

@keyframes avatar{

0%{filter:brightness(1);}
50%{filter:brightness(1.5);}
100%{filter:brightness(1);}

}

.avatar::before{

content:"";
position:absolute;
inset:-8px;
border-radius:50%;
border:4px dotted #8ad6ff;
animation:spin 8s linear infinite;

}

.avatar::after{

content:"";
position:absolute;
inset:-12px;
border-radius:50%;
border:3px dotted #ff9be9;
animation:spin2 12s linear infinite;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

@keyframes spin2{

100%{
transform:rotate(-360deg);
}

}

.avatar img{

width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
filter:grayscale(100%);
opacity:.80;

}

.nombre{

font-family:cursive;
font-size:30px;
margin-top:18px;
text-align:center;

color:#fff;

}

.frase{

margin-top:10px;
text-align:center;
line-height:1.7;

}

.stats{

display:flex;
justify-content:space-between;
margin-top:30px;
gap:10px;

}

.card{

flex:1;
background:#111;
padding:15px;
border-radius:18px;
text-align:center;

}

footer{

margin-top:35px;
text-align:center;
color:#ffc8f0;

}

.cursor{

position:fixed;
pointer-events:none;
font-size:22px;
animation:cursor 1s infinite;

}

@keyframes cursor{

0%{filter:drop-shadow(0 0 8px #d28cff);}
33%{filter:drop-shadow(0 0 8px #ff96dc);}
66%{filter:drop-shadow(0 0 8px #8fdcff);}
100%{filter:drop-shadow(0 0 8px #d28cff);}

}

@media(max-width:600px){

.panel{

width:95%;

}

.avatar{

width:110px;
height:110px;

}

.stats{

flex-direction:column;

}

}
</style>

</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="panel" id="login">

<h1>Marita</h1>

<label>Contraseña (9070)</label>

<div class="inputBox">

<input type="password" id="pass">

<div class="eye" onclick="mostrar()">👁</div>

</div>

<button onclick="entrar()">
Entrar
</button>

<div class="fecha">

<div id="hora"></div>

</div>

</div>

<div class="panel" id="perfil">

<div class="avatar">

<img src="https://xatimg.com/image/MjxtztH9qgVR.png">

</div>

<div class="nombre">
✦@Marita✦
</div>

<div class="frase">

✨ Conquistando el mundo. ✨

<br><br>

Un espacio lleno de Misterio,
Dulzura y Magia.

</div>

<div class="stats">

<div class="card">

<b>9999</b><br>
Poder Mágico

</div>

<div class="card">

<b>15.8K</b><br>
Seguidores

</div>

<div class="card">

<b>200% 💖</b><br>
Amor

</div>

</div>

<div class="frase">

🏹 Sagitario

</div>

<footer>

@Dulcinea Hechizera 💖

</footer>

</div>

<div class="cursor" id="cursor">💜</div>

<script>

function mostrar(){

let x=document.getElementById("pass");

x.type=x.type=="password"?"text":"password";

}

function entrar(){

if(document.getElementById("pass").value=="9070"){

login.style.display="none";
perfil.style.display="block";

}else{

alert("Contraseña incorrecta");

}

}

setInterval(()=>{

const fecha=new Date();

document.getElementById("hora").innerHTML=

fecha.toLocaleString("es-MX",{

timeZone:"America/Mexico_City",
dateStyle:"full",
timeStyle:"medium"

});

},1000);

// corazones

for(let i=0;i<45;i++){

let h=document.createElement("span");

h.innerHTML="💖";

h.style.left=Math.random()*100+"%";

h.style.animationDuration=(6+Math.random()*8)+"s";

h.style.animationDelay=Math.random()*8+"s";

let colores=["#ff9ce7","#d08cff","#87dbff"];

h.style.color=colores[Math.floor(Math.random()*3)];

document.getElementById("hearts").appendChild(h);

}

// cursor

const c=document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{

c.style.left=e.pageX+"px";
c.style.top=e.pageY+"px";

});

let colores=["💜","🩷","🩵"];

setInterval(()=>{

c.innerHTML=colores[Math.floor(Math.random()*3)];

},400);

</script>

</body>
</html>
