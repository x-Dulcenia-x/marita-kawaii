<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marita - Kawaii Space</title>
    <style>
        /* Cursor personalizado de corazón con parpadeo */
        body {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23ff9ecd' stroke='%23ffffff' stroke-width='2' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>"), auto;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Fondo con imagen y opacidad del 80% sobre fondo negro */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(255,182,193,0.2)), url('https://xatimg.com/image/sVp4PkQHEywp.png');
            background-size: cover;
            background-position: center;
            opacity: 0.8;
            z-index: -2;
        }

        /* Lluvia de corazones y fondo rosita bajito cayendo */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .heart-fall {
            position: absolute;
            top: -10vh;
            color: #ffb6c1;
            font-size: 20px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 1; }
            100% { transform: translateY(110vh) translateX(20px); opacity: 0.2; }
        }

        /* Paneles independientes */
        .section-box {
            background: rgba(15, 15, 15, 0.85);
            border: 2px dashed #ffb6c1;
            border-radius: 20px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
            text-align: center;
        }

        /* Panel de Contraseña */
        #auth-panel {
            margin-top: 15vh;
        }
        
        /* Título Marita con cursiva y parpadeo de colores lila, azul, rosa */
        .title-marita {
            font-style: italic;
            font-size: 2.2rem;
            animation: colorBlink 3s infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes colorBlink {
            0% { color: #d8b4fe; } /* Lila */
            33% { color: #93c5fd; } /* Azul */
            66% { color: #f472b6; } /* Rosa */
            100% { color: #d8b4fe; }
        }

        .password-container {
            position: relative;
            margin: 20px 0;
        }
        input[type="password"], input[type="text"] {
            padding: 10px 40px 10px 15px;
            border-radius: 15px;
            border: 2px solid #d8b4fe;
            background: #1a1a1a;
            color: #d8b4fe;
            font-size: 1.1rem;
            outline: none;
            width: 70%;
        }
